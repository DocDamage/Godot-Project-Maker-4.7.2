name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable autocrlf (generated files are compared byte for byte)
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Error codes are up to date
        shell: bash
        run: |
          python tools/gen_error_codes.py
          git diff --exit-code
      - name: Synthetic packs are up to date
        shell: bash
        run: |
          python tools/make_synthetic_packs.py --out test_packs/synthetic
          git diff --exit-code
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Detection accuracy (synthetic corpus)
        run: python -m rpggen analyze --corpus test_packs/synthetic --report accuracy_report.json
      - name: GDScript tests
        run: python -m rpggen.dev godot-test
      - name: Integration tests
        run: python -m pytest -q -m integration
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            **/rpggen/logs/**
            **/.rpggen_failed/**
            tests/**/results.json
            accuracy_report.json
          if-no-files-found: ignore

  ubuntu:
    # The same checks as the Windows job, on Linux (case-sensitive paths, POSIX separators),
    # plus mypy. Packaging stays Windows-only for 1.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Qt offscreen platform and the headless Godot binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libasound2t64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-linux-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot --platform linux | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      # PNG and zip bytes depend on the platform's zlib, so the synthetic packs are compared byte
      # for byte only on Windows (above); here tests/unit/test_synthetic_packs.py compares decoded
      # pixels and zip contents.
      - name: Error codes are up to date
        run: |
          python tools/gen_error_codes.py
          git diff --exit-code
      - name: Lint and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy rpggen
      - name: Unit and GUI tests (offscreen)
        run: python -m pytest -q -m "not integration"
      - name: Detection accuracy (synthetic corpus)
        run: python -m rpggen analyze --corpus test_packs/synthetic --report accuracy_report.json
      - name: GDScript tests
        run: python -m rpggen.dev godot-test
      - name: Integration tests (Godot headless)
        run: python -m pytest -q -m integration
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux
          path: |
            **/rpggen/logs/**
            **/.rpggen_failed/**
            accuracy_report.json
          if-no-files-found: ignore

  # Performance targets (ARCHITECTURE section 45) on a 1,000-image pack. Slow, so it only runs
  # on main and on demand, not on every pull request.
  perf:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable autocrlf
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Performance tests
        run: python -m pytest -q -m slow tests/perf
