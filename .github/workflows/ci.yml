name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs the whole suite on the tagged commit first

env:
  GODOT_VERSION: "4.7.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disable autocrlf (generated files are compared byte for byte)
        run: git config core.autocrlf false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The Windows job runs on exactly the versions the release ships (requirements/release.txt).
      - name: Install from the lock file
        shell: bash
        run: |
          pip install --require-hashes -r requirements/release.txt
          pip install --no-build-isolation --no-deps -e .
      - name: The lock file is up to date
        shell: bash
        run: |
          pip install pip-tools
          pip-compile --generate-hashes --allow-unsafe --extra dev --extra maps --quiet --strip-extras \
            -o requirements/release.txt pyproject.toml
          git diff --exit-code requirements/release.txt
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Error codes are up to date
        shell: bash
        run: |
          python tools/gen_error_codes.py
          git diff --exit-code
      - name: Synthetic packs are up to date
        shell: bash
        run: |
          python tools/make_synthetic_packs.py --out test_packs/synthetic
          git diff --exit-code
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Detection accuracy (synthetic corpus)
        run: python -m rpggen analyze --corpus test_packs/synthetic --report accuracy_report.json
      - name: GDScript tests
        run: python -m rpggen.dev godot-test
      - name: Integration tests
        run: python -m pytest -q -m "integration and not arpg and not metroidvania and not shmup and not run_and_gun and not racing and not farm and not isometric"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics
          path: |
            **/rpggen/logs/**
            **/.rpggen_failed/**
            tests/**/results.json
            tests/gui/goldens/_failed/**
            accuracy_report.json
          if-no-files-found: ignore

  ubuntu:
    # The same checks as the Windows job, on Linux (case-sensitive paths, POSIX separators),
    # plus mypy (the Linux packages are built by release.yml). Two legs: the newest PySide6 (the whole
    # job) and the oldest one the package allows, 6.7, which only runs the GUI tests: Qt's minor
    # releases change styles and layout rules, and the layout test is what notices.
    name: ubuntu (PySide6 ${{ matrix.pyside }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyside: ["6.7.*", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries (Qt offscreen platform and the headless Godot binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libasound2t64 \
            fonts-dejavu-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: The oldest PySide6 the package allows
        if: matrix.pyside != 'latest'
        run: pip install "PySide6==${{ matrix.pyside }}"
      - name: GUI tests on the oldest PySide6 (offscreen)
        if: matrix.pyside != 'latest'
        run: python -m pytest -q -m "not integration" tests/gui
      - name: Cache Godot
        if: matrix.pyside == 'latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-linux-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        if: matrix.pyside == 'latest'
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot --platform linux | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      # PNG and zip bytes depend on the platform's zlib, so the synthetic packs are compared byte
      # for byte only on Windows (above); here tests/unit/test_synthetic_packs.py compares decoded
      # pixels and zip contents.
      - name: Error codes are up to date
        if: matrix.pyside == 'latest'
        run: |
          python tools/gen_error_codes.py
          git diff --exit-code
      - name: Lint and types
        if: matrix.pyside == 'latest'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy rpggen
      - name: Unit and GUI tests (offscreen)
        if: matrix.pyside == 'latest'
        run: python -m pytest -q -m "not integration"
      - name: Detection accuracy (synthetic corpus)
        if: matrix.pyside == 'latest'
        run: python -m rpggen analyze --corpus test_packs/synthetic --report accuracy_report.json
      - name: GDScript tests
        if: matrix.pyside == 'latest'
        run: python -m rpggen.dev godot-test
      - name: Integration tests (Godot headless)
        if: matrix.pyside == 'latest'
        run: python -m pytest -q -m "integration and not arpg and not metroidvania and not shmup and not run_and_gun and not racing and not farm and not isometric"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-linux-${{ matrix.pyside == 'latest' && 'latest' || 'pyside67' }}
          path: |
            **/rpggen/logs/**
            **/.rpggen_failed/**
            accuracy_report.json
          if-no-files-found: ignore

  # The integration suites of the archetypes that are not the default one, a job each (T14.11):
  # every archetype generates, validates and plays its sample, which is minutes per run, and on
  # one runner the wall-clock time would grow with every archetype. The jobs above run the rest
  # (`-m "integration and not arpg and not metroidvania and not shmup and not run_and_gun and not racing and not farm and not isometric"`).
  archetype-integration:
    name: integration (${{ matrix.archetype }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        archetype: [arpg, metroidvania, shmup, run_and_gun, racing, farm, isometric]
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disable autocrlf (generated files are compared byte for byte)
        run: git config core.autocrlf false
      - name: System libraries (Qt offscreen platform and the headless Godot binary)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libasound2t64 \
            fonts-dejavu-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from the lock file
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install --require-hashes -r requirements/release.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Install
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: ${{ runner.os == 'Linux' && 'godot-linux' || 'godot' }}-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          # unquoted on purpose below: two words on Linux, nothing on Windows
          platform="${{ runner.os == 'Linux' && '--platform linux' || '' }}"
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot $platform | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Integration tests of the archetype
        run: python -m pytest -q -m "integration and ${{ matrix.archetype }}"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.archetype }}-${{ matrix.os }}
          path: |
            **/rpggen/logs/**
            **/.rpggen_failed/**
          if-no-files-found: ignore

  # Accuracy on real packs that cannot be committed (T12.26). The entries (fingerprints and
  # confirmed decisions, no pixels) and the packs live on the maintainer's own runner; the job
  # only runs when the repository variable PRIVATE_CORPUS names the entries' folder there.
  private-corpus:
    if: vars.PRIVATE_CORPUS != ''
    runs-on: [self-hosted, windows, rpggen-corpus]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from the lock file
        shell: bash
        run: |
          pip install --require-hashes -r requirements/release.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Accuracy on the private corpus
        shell: bash
        run: |
          python -m rpggen analyze --private-corpus "${{ vars.PRIVATE_CORPUS }}"             --packs "${{ vars.PRIVATE_PACKS }}" --report private_corpus_report.json
          cat private_corpus_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-corpus-report
          path: |
            private_corpus_report.json
            private_corpus_report.md

  # Performance targets (ARCHITECTURE section 45) on a 1,000-image pack. Slow, so it only runs
  # on main and on demand, not on every pull request.
  perf:
    # Also on a pull request that carries the label "perf". The numbers go to a trend (below).
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: windows-latest
    permissions:
      contents: write # the trend is committed to the gh-pages branch from main
      pull-requests: write # and a warning is a comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disable autocrlf
        run: git config core.autocrlf false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Performance tests
        run: python -m pytest -q -m slow tests/perf
        env:
          RPGGEN_PERF_JSON: perf.json
      # The trend lives on the gh-pages branch; the first run on main creates it (empty).
      - name: Create the gh-pages branch for the trend
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            # an empty commit made without switching branches (the checkout stays as it is)
            empty_tree=$(git mktree < /dev/null)
            commit=$(git -c user.name=github-actions               -c user.email=github-actions@users.noreply.github.com               commit-tree "$empty_tree" -m "Performance trend")
            git push origin "$commit:refs/heads/gh-pages"
          fi
      # The hard ceilings stay in the tests. This keeps the numbers of every run on main and
      # comments when one is more than 30% above the previous run; it never fails the build.
      - name: Publish the performance trend
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: rpggen performance
          tool: customSmallerIsBetter
          output-file-path: perf.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "130%"
          comment-on-alert: true
          fail-on-alert: false
          auto-push: ${{ github.ref == 'refs/heads/main' }}
