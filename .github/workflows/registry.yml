name: Registry

on:
  pull_request:
    paths: ["registry/**"]
  push:
    branches: [main]
    paths: ["registry/**"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every profile and regenerate index.json
        run: python registry/scripts/build_index.py
      - name: Commit the regenerated index (main only)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- registry/index.json; then
            git config user.name "rpggen registry bot"
            git config user.email "actions@users.noreply.github.com"
            git add registry/index.json
            git commit -m "Regenerate registry/index.json"
            git push
          fi
      - name: The index is up to date (pull requests)
        if: github.event_name == 'pull_request'
        run: python registry/scripts/build_index.py --check
