name: Release

# Runs on a version tag (v1.0.0, ...). On Windows, Linux and macOS: builds the one-folder bundle
# and runs the frozen smoke test. Windows: the installer and the portable zip, signed when signing
# is configured. Linux (Ubuntu 22.04, the glibc floor): an AppImage and a tar.gz. macOS: the .app
# in a zip, unsigned. The publish job attaches everything with one SHA256SUMS.txt to a GitHub
# Release. See docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: write
  id-token: write # SignPath trusted build identity

jobs:
  # The whole suite (unit, GUI, GDScript, integration, perf) runs on the tagged commit first.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disable autocrlf
        run: git config core.autocrlf false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The release is built from the versions in the lock file, never from "whatever is latest".
      - name: Install from the lock file
        shell: bash
        run: |
          pip install --require-hashes -r requirements/release.txt
          pip install --no-build-isolation --no-deps -e .
      - name: The 1.0 gate (the held-out accuracy table is filled in)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if grep -n '\*(pending)\*' docs/coverage.md; then
            echo "docs/coverage.md still has pending rows (T10.09, T10.10): the release stops here"
            exit 1
          fi
      - name: Check that the tag matches the version
        shell: bash
        run: |
          python -m pytest -q tests/unit/test_release.py
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=$(python -c "import rpggen; print(rpggen.__version__)")
            [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          fi
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        shell: bash
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Build the bundle and run the frozen smoke test
        shell: bash
        run: python tools/package.py --smoke --godot "$RPGGEN_GODOT" --installer

      # Signing. Until a signing program accepts the project, SIGNPATH_ORGANIZATION_ID is not set
      # and the artifacts are published unsigned, with SHA-256 sums (docs/release.md).
      - name: Signing is configured?
        id: signing
        shell: bash
        run: |
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload unsigned files for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            dist/rpggen/rpggen.exe
            dist/rpggen/rpggen-cli.exe
            dist/rpggen-*-setup.exe
      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rpggen
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Put the signed files back, then rebuild zip, installer and sums
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp signed/rpggen.exe signed/rpggen-cli.exe dist/rpggen/
          # the installer is signed too: rebuild it from the signed bundle and replace it
          python tools/package.py --skip-build --installer
          cp signed/rpggen-*-setup.exe dist/ || true
          cd dist && sha256sum rpggen-* > SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/rpggen-*-setup.exe
            dist/rpggen-*-portable.zip

  # Linux: built on the oldest supported Ubuntu, so the bundle runs on newer glibc versions too
  # (PySide6 6.11 itself needs glibc 2.34).
  linux:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from the Linux lock file
        run: |
          pip install --require-hashes -r requirements/release-linux.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Tools the AppImage build checks the desktop file with
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Build the bundle, run the frozen smoke test, make the AppImage and the tar.gz
        run: python tools/package.py --smoke --godot "$RPGGEN_GODOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            dist/rpggen-*.AppImage
            dist/rpggen-*-linux-x86_64.tar.gz

  # macOS: an arm64 .app, unsigned for now (notarization is a later step, docs/release.md).
  macos:
    needs: ci
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from the macOS lock file
        run: |
          pip install --require-hashes -r requirements/release-macos.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        run: |
          exe=$(python tools/fetch_godot.py --version "$GODOT_VERSION" --out .cache/godot | tail -n 1)
          echo "RPGGEN_GODOT=$exe" >> "$GITHUB_ENV"
      - name: Build the app, run the frozen smoke test and zip it
        run: python tools/package.py --smoke --godot "$RPGGEN_GODOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/rpggen-*-macos-*.zip

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: One SHA256SUMS.txt for every platform
        run: |
          cd dist
          sha256sum rpggen-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for kind in setup.exe portable.zip x86_64.AppImage linux-x86_64.tar.gz macos-; do
            ls rpggen-*"$kind"* > /dev/null || { echo "missing: $kind"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/rpggen-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
