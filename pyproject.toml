[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpggen"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.3",
  "numpy>=1.26",
  "jsonschema>=4.21",
  "py7zr>=0.21",
  "PySide6>=6.7,<7",
  "psutil>=5.9",
  "soundfile>=0.12",
]
[project.optional-dependencies]
# Zstandard layers of Tiled maps (T13.14); the packages always include it
maps = ["zstandard>=0.22"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10", "types-jsonschema", "pyinstaller>=6.6"]
[project.scripts]
rpggen = "rpggen.cli:main"
[tool.setuptools.packages.find]
include = ["rpggen*"]
[tool.setuptools.package-data]
rpggen = ["schema/*.json", "gui/*.qss.in", "gui/icons/*.svg"]
[tool.ruff]
line-length = 100
extend-exclude = ["godot_templates", "docs/spec", ".venv", "rpggen/errors_table.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[[tool.mypy.overrides]]
# a mixin whose methods run on the MainWindow it is mixed into
module = "rpggen.gui.window_menus"
disable_error_code = ["attr-defined", "call-overload", "arg-type"]
[tool.pytest.ini_options]
markers = [
    "integration: needs RPGGEN_GODOT",
    "slow: long-running",
    "arpg: integration tests of the action-RPG archetype (a CI job of their own)",
    "metroidvania: integration tests of the metroidvania archetype (a CI job of their own)",
    "shmup: integration tests of the shoot-em-up (a CI job of their own)",
    "run_and_gun: integration tests of the run and gun (a CI job of their own)",
    "racing: integration tests of the racing game (a CI job of their own)",
]
testpaths = ["tests"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"rpggen/core/classifier.py" = ["E501"]
"rpggen/godot_target.py" = ["E501"]  # the pinned 128-digit checksums
