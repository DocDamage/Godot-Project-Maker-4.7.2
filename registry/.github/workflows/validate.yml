name: Validate profiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every profile and regenerate index.json
        run: python scripts/build_index.py
      - name: Commit the regenerated index (main only)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "rpggen-profiles bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.json
            git commit -m "Regenerate index.json"
            git push
          fi
      - name: The index is up to date (pull requests)
        if: github.event_name == 'pull_request'
        run: python scripts/build_index.py --check
